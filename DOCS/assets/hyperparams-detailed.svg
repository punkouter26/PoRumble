lns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Three trainer configs - all PPO, all behaviour PoRumbleBoxer</p></span></div></foreignObject></g></g></g><g class="edgePaths"/><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-P1-0" data-look="classic" transform="translate(175.5, 143.5)"><rect class="basic label-container" style="" x="-130" y="-100.5" width="260" height="201"/><g class="label" style="" transform="translate(-100, -85.5)"><rect/><foreignObject width="200" height="171"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>porumble_spar.yaml<br />stage 1b - vs scripted<br />batch 1024 / buffer 10240<br />beta 1.0e-3 - lr linear<br />max 5M - keep 50</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P2-1" data-look="classic" transform="translate(175.5, 423)"><rect class="basic label-container" style="" x="-130" y="-129" width="260" height="258"/><g class="label" style="" transform="translate(-100, -114)"><rect/><foreignObject width="200" height="228"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>porumble_ppo.yaml<br />stage 1 - self-play<br />batch 1024 / buffer 10240<br />beta 5.0e-3 - lr constant<br />max 8M - keep 40<br />self_play block present</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-P3-2" data-look="classic" transform="translate(175.5, 716.75)"><rect class="basic label-container" style="" x="-130" y="-114.75" width="260" height="229.5"/><g class="label" style="" transform="translate(-100, -99.75)"><rect/><foreignObject width="200" height="199.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>porumble_ffa.yaml<br />stage 3 - ten-way<br />batch 2048 / buffer 20480<br />beta 2.0e-3 - lr linear<br />max 8M - keep 80<br />NO self_play</p></span></div></foreignObject></g></g></g></g><g class="node default" id="my-svg-flowchart-SHARED-3" data-look="classic" transform="translate(293, 1045.5)"><rect class="basic label-container" style="" x="-130" y="-129" width="260" height="258"/><g class="label" style="" transform="translate(-100, -114)"><rect/><foreignObject width="200" height="228"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Shared across all three<br />gamma 0.997 - time_horizon 256<br />epsilon 0.2 - lambd 0.95 - num_epoch 3<br />hidden 256 x 2 - normalize false<br />summary_freq 10000</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-G-6" data-look="classic" transform="translate(138, 1353.5)"><rect class="basic label-container" style="fill:#C8342B !important;stroke:#8E241E !important" x="-130" y="-129" width="260" height="258"/><g class="label" style="color:#FFFFFF !important" transform="translate(-100, -114)"><rect/><foreignObject width="200" height="228"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#FFFFFF !important" class="nodeLabel"><p>gamma 0.997, not 0.995<br />episode is MaxStep 2500 / DecisionPeriod 5 = 500 decisions<br />0.995^500 = 0.08 at the bell - too faint<br />0.997^500 = 0.22</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-H-7" data-look="classic" transform="translate(448, 1353.5)"><rect class="basic label-container" style="" x="-130" y="-100.5" width="260" height="201"/><g class="label" style="" transform="translate(-100, -85.5)"><rect/><foreignObject width="200" height="171"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>time_horizon 256, not 128<br />a horizon far below the discount horizon<br />bootstraps away the terminal win reward</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-K-8" data-look="classic" transform="translate(603, 1045.5)"><rect class="basic label-container" style="fill:#2E5E8C !important;stroke:#1F4363 !important" x="-130" y="-100.5" width="260" height="201"/><g class="label" style="color:#FFFFFF !important" transform="translate(-100, -85.5)"><rect/><foreignObject width="200" height="171"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#FFFFFF !important" class="nodeLabel"><p>keep_checkpoints must cover max_steps / checkpoint_interval<br />15 kept of 50 written was a trailing 30% window</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#B9B2A4" stop-opacity="1"/><stop offset="100%" stop-color="hsl(40, 0%, 80.5882352941%)" stop-opacity="1"/></linearGradient></svg>