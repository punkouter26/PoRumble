# ML-Agents trainer configuration - PoRumble stage 3 (10-boxer free-for-all)
#
#   mlagents-learn Assets/Config/porumble_ffa.yaml --run-id=pr_10way --initialize-from=pr_1v1
#   ...then open Assets/Scenes/Training10.unity and press Play.
#
# Deliberately has no self_play block. Self-play models two-team symmetric games via team_id;
# a free-for-all is not that. Here ten boxers simply share one behaviour and train against
# copies of themselves under plain PPO.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 100000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
