# Stage 1b - one learner against the hand-written sparring partner.
#
#   mlagents-learn Assets/Config/porumble_spar.yaml --run-id=spar_01
#   ...then open Assets/Scenes/Training1v1.unity and press Play.
#
# No self_play block on purpose. The opponent is scripted and fixed, so there is no second
# team and no ELO to track; the learner simply trains against a stable target.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      # Entropy stayed pinned near maximum at 190k steps, so the policy was never
      # committing to anything. Lowered to let it sharpen.
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # An episode is MaxStep 1500 physics steps at DecisionPeriod 5, so 300 decisions.
        # At gamma 0.99 the +2 win bonus is worth 0.99^300 = 0.05 at the opening bell, which
        # is far too faint to shape the early game; 0.995 doubles the horizon to ~200
        # decisions (20s) and leaves the win worth 0.22 from the first step.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 15
    checkpoint_interval: 100000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
