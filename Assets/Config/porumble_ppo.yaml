# ML-Agents trainer configuration - PoRumble
#
# Stage 1 (1v1 self-play):
#   .venv\Scripts\activate
#   mlagents-learn Assets/Config/porumble_ppo.yaml --run-id=pr_1v1
#   ...then press Play with Assets/Scenes/Training1v1.unity open.
#
# Stage 2/3 transfer:
#   mlagents-learn ... --run-id=pr_4way  --initialize-from=pr_1v1
#   mlagents-learn ... --run-id=pr_10way --initialize-from=pr_4way
#
# Package com.unity.ml-agents 4.1.0 <-> pip mlagents 1.1.0 (communicator API 1.5.0).
# The behaviour name must match BehaviorParameters on the Boxer prefab exactly.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # An episode is MaxStep 2500 physics steps at DecisionPeriod 5, so 500 decisions.
        # Read that off the Boxer prefab, never off this comment: it claimed 1500 for the
        # whole curriculum while the prefab said 2500, which made the real discount horizon
        # 2.7x shorter than the tuning here asserted.
        #
        # The win bonus has to still be worth something at the opening bell. At 0.995 it is
        # 0.995^500 = 0.08 - too faint to shape the early game, and the reason the policy
        # optimised the dense terms instead. 0.997 is a ~333-decision horizon and leaves the
        # +6 win worth 1.3 from the first step.
        gamma: 0.997
        strength: 1.0
    keep_checkpoints: 40
    checkpoint_interval: 200000
    max_steps: 8000000
    # 256, not 128. Gamma 0.997 is a ~333-decision horizon, and a time_horizon far under
    # that bootstraps the value estimate before the terminal win reward can propagate into
    # it - which is most of why the win signal never showed up in the returns. Costs buffer
    # memory, not compute.
    time_horizon: 256
    summary_freq: 10000

    # Self-play. Valid for stage 1, where the two boxers are opposing teams.
    #
    # Remove this block for stages 2 and 3: self-play models two-team symmetric games via
    # team_id, and a free-for-all is not that. In an FFA every boxer simply shares this one
    # behaviour and trains against copies of itself under plain PPO.
    self_play:
      save_steps: 20000
      team_change: 100000
      swap_steps: 10000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

# Fades the dense shaping out as the run goes on. The three shaping terms in BoxerAgentView
# were scaffolding for a policy whose ray sensor reported nothing but its own torso: they pay
# per step for facing an opponent and for *standing* at punching range, which is exactly the
# behaviour to reward when a fighter cannot find anybody, and exactly the wrong one once it
# can - hovering at reach without throwing scores nearly as well as fighting.
#
# Measured on progress rather than reward, deliberately. A reward threshold would have to be
# guessed against a reward function that these lessons themselves rescale, and guessing it
# low pins the run in lesson one for ever.
environment_parameters:
  shaping_scale:
    curriculum:
      - name: Scaffolded
        completion_criteria:
          measure: progress
          behavior: PoRumbleBoxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.15
        value: 1.0
      - name: Fading
        completion_criteria:
          measure: progress
          behavior: PoRumbleBoxer
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.3
        value: 0.5
      - name: Bare
        value: 0.0
