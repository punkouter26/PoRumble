# ML-Agents trainer configuration - PoRumble stage 3 (10-boxer free-for-all)
#
#   mlagents-learn Assets/Config/Training/porumble_10way_ffa.yaml --run-id=pr_10way --initialize-from=pr_1v1
#   ...then open Assets/Scenes/Training10Way.unity and press Play. For a long run use a headless
#   build instead - Tools/train_overnight.ps1 builds nothing, it drives Builds/Train10Way.
#
# The ring is the game's own 17x17, and seats 8 and 9 run the scripted brain as two seats of the
# game's card do, so eight learners per arena train against the opponents they will meet.
#
# Deliberately has no self_play block. Self-play models two-team symmetric games via team_id;
# a free-for-all is not that. Here ten boxers simply share one behaviour and train against
# copies of themselves under plain PPO.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      # Eight learners per arena across several arenas fill a buffer quickly; a larger one
      # averages each update over more matches.
      buffer_size: 40960
      learning_rate: 3.0e-4
      # Between the spar config's 1.0e-3 and the old 5.0e-3, and deliberately so. This stage
      # is initialized from the 1v1 policy, whose entropy has already been driven down to
      # ~2.5; an entropy bonus five times larger would push it straight back up and wash out
      # the transfer. But a ten-way free-for-all genuinely is a new task - more opponents,
      # shrinking field, no fixed sparring partner - so it earns more exploration than the
      # 1v1 stage, not the same.
      beta: 2.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      # Held, not decayed. Left unset, beta follows the learning rate's linear schedule to
      # zero, and in pr_ffa_0929 entropy fell 1.95 -> 0.43 while every one of its matches
      # still went to the bell: the policy committed hard to a local optimum it had no
      # exploration left to climb out of. The learning rate still anneals, so updates settle.
      beta_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # MaxStep on the prefab is 2500 physics steps at DecisionPeriod 5, so a match that goes
        # to the bell is 500 decisions. At the spar's 0.995 the horizon is ~200 decisions and a
        # knockout win at the end of a ten-way is worth 0.995^500 = 0.08 from the opening bell -
        # the terminal reward barely reaches the decisions that set it up. 0.998 makes the
        # horizon the whole match (~500 decisions) and leaves the +2 worth 0.74 from the first
        # step. The spar keeps 0.995: its knockouts land in ~100 decisions.
        gamma: 0.998
        strength: 1.0
    # Keeps the whole run, not a trailing window. Reward alone is a poor guide to the best
    # model here - it stayed flat at ~6.05 across 3M steps while the rate at which matches
    # actually finished peaked near 1M and then slid from 50% back to 34%. At five, the peak
    # checkpoint had already been rotated away by the time that was visible.
    keep_checkpoints: 30
    checkpoint_interval: 1000000
    # Was 40M. In pr_ffa_0929 the last 16M steps - 2.5 of its 6.2 hours - moved windowed
    # reward from 6.20 to 6.31 and the finish rate not at all. 24M keeps the part of the
    # curve that was still climbing and hands the rest of the night back. Knocked-out
    # boxers no longer send experience, so each of these steps is a live decision; the
    # ten-way used to spend a share of every batch on corpses.
    max_steps: 24000000
    time_horizon: 128
    summary_freq: 20000
    threaded: true
