# Stage 1b - one learner against the hand-written sparring partner.
#
#   mlagents-learn Assets/Config/Training/porumble_1v1_spar.yaml --run-id=spar_01
#   ...then open Assets/Scenes/Training1v1.unity and press Play.
#
# No self_play block on purpose. The opponent is scripted and fixed, so there is no second
# team and no ELO to track; the learner simply trains against a stable target.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      # Entropy stayed pinned near maximum at 190k steps, so the policy was never
      # committing to anything. Lowered to let it sharpen.
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # MaxStep on the prefab is 2500 physics steps at DecisionPeriod 5, so a match that goes
        # to the bell is 500 decisions. 0.995 gives a ~200-decision (20s) horizon: the +2
        # knockout win is worth 0.995^500 = 0.08 from the opening bell, but a 1v1 spar finishes
        # in ~100 decisions, where it is worth 1.2. Raising gamma for the ten-way is a
        # candidate experiment, deliberately not bundled with the changes of 2026-09-29.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 15
    checkpoint_interval: 250000
    # Was 1.5M. pr_spar_0929 had reached 8.94 of its final 8.98 reward by 0.8M and was
    # knocking the partner out in 105 decisions by 1.1M against 99 at the end. It is a warm
    # start for the ten-way, not the product, and at ~450 steps/s the tail cost 18 minutes.
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    # Trainer updates overlap environment stepping. Measured CPU-bound on the environments
    # (doubling --time-scale gained nothing), so the update no longer idles them.
    threaded: true
