# ML-Agents trainer configuration - PoRumble
#
# Stage 1 (1v1 self-play):
#   .venv\Scripts\activate
#   mlagents-learn Assets/Config/Training/porumble_1v1_selfplay.yaml --run-id=pr_1v1
#   ...then press Play with Assets/Scenes/Training1v1.unity open.
#
# Stage 2/3 transfer:
#   mlagents-learn ... --run-id=pr_4way  --initialize-from=pr_1v1
#   mlagents-learn ... --run-id=pr_10way --initialize-from=pr_4way
#
# Package com.unity.ml-agents 4.1.0 <-> pip mlagents 1.1.0 (communicator API 1.5.0).
# The behaviour name must match BehaviorParameters on the Boxer prefab exactly.

behaviors:
  PoRumbleBoxer:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # MaxStep on the prefab is 2500 physics steps at DecisionPeriod 5, so a match that goes
        # to the bell is 500 decisions. 0.995 gives a ~200-decision (20s) horizon: the +2
        # knockout win is worth 0.995^500 = 0.08 from the opening bell, but a 1v1 spar finishes
        # in ~100 decisions, where it is worth 1.2. Raising gamma for the ten-way is a
        # candidate experiment, deliberately not bundled with the changes of 2026-09-29.
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 15
    checkpoint_interval: 200000
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000

    # Self-play. Valid for stage 1, where the two boxers are opposing teams.
    #
    # Remove this block for stages 2 and 3: self-play models two-team symmetric games via
    # team_id, and a free-for-all is not that. In an FFA every boxer simply shares this one
    # behaviour and trains against copies of itself under plain PPO.
    self_play:
      save_steps: 20000
      team_change: 100000
      swap_steps: 10000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
